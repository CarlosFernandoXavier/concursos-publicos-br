name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Check current directory
        run: |
          pwd
          ls -la

      - name: Build and test (all modules)
        working-directory: ./
        run: |
          mvn -B -U clean compile -e -X
          mvn -B -U test
          mvn -B -U verify
